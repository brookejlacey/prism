[package]
name = "prism-pvm-crypto"
version = "0.1.0"
edition = "2021"
description = "PVM Rust precompiles for Prism Protocol — accelerated cryptography for Polkadot Hub"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Cryptographic primitives
ark-ff = "0.4"
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "crypto_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
